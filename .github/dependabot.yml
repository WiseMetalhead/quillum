version: 2
# Обычные minor/patch-обновления автоматизируются, а major-переходы выполняются вручную.
# Ограничения allow относятся к version updates и не отключают security updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["@tiptap/*"]
        update-types: [minor, patch]
      tiptap:
        applies-to: version-updates
        patterns: ["@tiptap/*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Moscow
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # webauthn 2.8.0 требует cbor2 < 6, а текущий autobahn — cbor2 >= 6.1.
      - dependency-name: webauthn
        versions: ["2.8.0"]
    groups:
      python-runtime:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: [pytest, pytest-django, ruff]
        update-types: [minor, patch]
      python-development:
        applies-to: version-updates
        patterns: [pytest, pytest-django, ruff]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Moscow
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Moscow
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Moscow
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
