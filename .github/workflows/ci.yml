name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run web:lint
      - run: npm --workspace apps/web run test:release

  collaboration:
    name: Collaboration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run collaboration:test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: quillum
          POSTGRES_USER: quillum
          POSTGRES_PASSWORD: quillum-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quillum -d quillum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: quillum
      POSTGRES_USER: quillum
      POSTGRES_PASSWORD: quillum-ci
      POSTGRES_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      QUILLUM_BOOTSTRAP_ADMIN_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.15
      - run: python -m pip install uv==0.13.4
      - run: uv --directory apps/api sync --frozen
      - run: uv --directory apps/api run ruff check .
      - run: uv --directory apps/api run python manage.py check
      - run: uv --directory apps/api run python manage.py makemigrations --check --dry-run
      - run: uv --directory apps/api run pytest

  docker:
    name: Docker image и Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить Compose-конфигурации
        run: |
          chmod +x scripts/public/*.sh
          ./scripts/public/init.sh
          sed -i 's/write\.example\.org/ci.example.org/g' .env.production
          docker compose --env-file .env.production -f compose.yaml -f compose.caddy.yaml config --quiet
          docker compose --env-file .env.production -f compose.yaml -f compose.external-proxy.yaml config --quiet
          docker compose --env-file .env.production -f compose.yaml -f compose.caddy.yaml -f compose.build.yaml config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: quillum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
