[project]
name = "quillum-api"
version = "1.0.0"
description = "Backend API Quillum"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "@WiseMetalhead and Quillum contributors" }]
requires-python = ">=3.12.15,<3.13"
dependencies = [
  "authlib>=1.7,<2.0",
  "autobahn>=26.10.1,<27.0",
  "av>=11,<19",
  "celery[redis]>=5.5,<6.0",
  "certifi>=2026.10.19",
  "channels>=4.2.1,<5.0",
  "channels-redis>=4.2,<5.0",
  "django>=5.2,<6.0",
  "django-cors-headers>=4.7,<5.0",
  "djangorestframework>=3.16,<4.0",
  "daphne>=4.1,<5.0",
  "ebooklib>=0.20,<1.0",
  "faster-whisper>=1.2,<2.0",
  "gunicorn>=23.0,<24.0",
  "pillow>=13.0,<14.0",
  "python-docx>=1.2,<2.0",
  "odfdo>=3.22,<4.0",
  "lxml>=5.4,<7.0",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4.0",
  "pyotp>=2.9,<3.0",
  "python-dotenv>=1.1,<2.0",
  "redis>=6.2,<7.0",
  "requests>=2.32,<3.0",
  "tokenizers>=0.21,<1.0",
  "webauthn>=2.5,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-django>=4.11,<5.0",
  "ruff>=0.12,<1.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
