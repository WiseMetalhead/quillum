name: quillum-development

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: quillum
      POSTGRES_USER: quillum
      POSTGRES_PASSWORD: quillum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_development:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quillum -d quillum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_development:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_development:
  redis_development:
