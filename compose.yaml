name: quillum

x-quillum-image: &quillum-image
  image: ${QUILLUM_IMAGE:-ghcr.io/wisemetalhead/quillum:1.0.0}
  pull_policy: ${QUILLUM_PULL_POLICY:-always}

x-quillum-environment: &quillum-environment
  QUILLUM_ENVIRONMENT: production
  QUILLUM_PUBLIC_ORIGIN: ${QUILLUM_PUBLIC_ORIGIN:?Укажите QUILLUM_PUBLIC_ORIGIN в .env.production}
  QUILLUM_VERSION: ${QUILLUM_VERSION:-1.0.0}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  POSTGRES_DB: ${POSTGRES_DB:-quillum}
  POSTGRES_USER: ${POSTGRES_USER:-quillum}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  QUILLUM_MEDIA_ROOT: /data/media
  QUILLUM_TRUSTED_PROXY_IPS: ${QUILLUM_TRUSTED_PROXY_IPS:-172.16.0.0/12}
  QUILLUM_COLLABORATION_MODE: ${QUILLUM_COLLABORATION_MODE:-enabled}
  QUILLUM_COLLABORATION_INTERNAL_SECRET_FILE: /run/secrets/collaboration_internal_secret
  QUILLUM_COLLABORATION_INTERNAL_ORIGIN: http://collaboration:8003
  QUILLUM_COLLABORATION_API_ORIGIN: http://api:8001
  QUILLUM_COLLABORATION_BIND: 0.0.0.0
  QUILLUM_COLLABORATION_PORT: "8003"
  QUILLUM_COLLABORATION_ALLOWED_ORIGINS: ${QUILLUM_PUBLIC_ORIGIN}
  QUILLUM_TRANSCRIPTION_MODEL_PATH: /data/models/faster-whisper-small
  QUILLUM_BOOTSTRAP_ADMIN_ENABLED: ${QUILLUM_BOOTSTRAP_ADMIN_ENABLED:-true}
  QUILLUM_BOOTSTRAP_ADMIN_USERNAME: ${QUILLUM_BOOTSTRAP_ADMIN_USERNAME:-admin}
  QUILLUM_BOOTSTRAP_ADMIN_EMAIL: ${QUILLUM_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
  QUILLUM_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
  QUILLUM_DJANGO_ADMIN_ENABLED: ${QUILLUM_DJANGO_ADMIN_ENABLED:-false}
  QUILLUM_OIDC_ENABLED: ${QUILLUM_OIDC_ENABLED:-false}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OpenID Connect}

x-quillum-django-secrets: &quillum-django-secrets
  - django_secret_key
  - collaboration_internal_secret
  - postgres_password
  - bootstrap_admin_password
  - oidc_client_secret

x-quillum-runtime: &quillum-runtime
  <<: *quillum-image
  environment: *quillum-environment
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1777
  networks:
    - application
    - data

services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quillum}
      POSTGRES_USER: ${POSTGRES_USER:-quillum}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  redis:
    image: docker.io/library/redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  init-volumes:
    <<: *quillum-image
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "/app/deploy/init-volumes.sh"]
    command: []
    pull_policy: ${QUILLUM_PULL_POLICY:-always}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - media_data:/data/media
      - transcription_models:/data/models
      - beat_data:/data/beat
    restart: "no"
    networks:
      - data

  migrate:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    command: ["/app/.venv/bin/python", "/app/apps/api/manage.py", "migrate", "--noinput"]
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    command:
      - /app/.venv/bin/gunicorn
      - --chdir
      - /app/apps/api
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8001
      - --workers
      - "2"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    volumes:
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          --header "Host: $${QUILLUM_PUBLIC_ORIGIN#https://}"
          --header "X-Forwarded-Proto: https"
          http://localhost:8001/api/health/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  realtime:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    command: ["/app/.venv/bin/daphne", "-b", "0.0.0.0", "-p", "8002", "config.asgi:application"]
    working_dir: /app/apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          --header "Host: $${QUILLUM_PUBLIC_ORIGIN#https://}"
          --header "X-Forwarded-Proto: https"
          http://localhost:8002/api/health/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  collaboration:
    <<: *quillum-runtime
    secrets:
      - collaboration_internal_secret
    command: ["node", "/app/apps/collaboration/src/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8003/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    command: ["/app/.venv/bin/celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "celery"]
    working_dir: /app/apps/api
    volumes:
      - media_data:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    restart: unless-stopped

  beat:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    command:
      - /app/.venv/bin/celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --pidfile=/data/beat/celerybeat.pid
      - --schedule=/data/beat/celerybeat-schedule
    working_dir: /app/apps/api
    volumes:
      - beat_data:/data/beat
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  gateway:
    <<: *quillum-runtime
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/nginx/client-body /tmp/nginx/proxy /tmp/nginx/fastcgi
        /tmp/nginx/uwsgi /tmp/nginx/scgi && exec nginx -c /app/deploy/nginx.conf -g 'daemon off;'
    networks:
      - frontend
      - application
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
      collaboration:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  model-init:
    <<: *quillum-runtime
    profiles: ["transcription"]
    command: ["/app/.venv/bin/python", "/app/deploy/install-transcription-model.py"]
    volumes:
      - transcription_models:/data/models
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    restart: "no"

  transcription:
    <<: *quillum-runtime
    secrets: *quillum-django-secrets
    profiles: ["transcription"]
    command:
      - /app/.venv/bin/celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --pool=solo
      - --concurrency=1
      - --prefetch-multiplier=1
      - -Q
      - transcription
    working_dir: /app/apps/api
    volumes:
      - media_data:/data/media
      - transcription_models:/data/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    stop_grace_period: 60s
    mem_limit: 3g
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  beat_data:
  transcription_models:

networks:
  frontend:
  application:
  data:
    internal: true

secrets:
  django_secret_key:
    file: ./.secrets/django_secret_key
  collaboration_internal_secret:
    file: ./.secrets/collaboration_internal_secret
  postgres_password:
    file: ./.secrets/postgres_password
  bootstrap_admin_password:
    file: ./.secrets/bootstrap_admin_password
  oidc_client_secret:
    file: ./.secrets/oidc_client_secret
