pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $quillum_cache_control {
        default "";
        ~^/(api|ws|static|django-admin)/ "";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/(index\.html|sw\.js|manifest\.webmanifest)$ "no-cache";
        ~^/[^.]*$ "no-cache";
    }

    map $http_x_forwarded_proto $quillum_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    map $http_x_forwarded_for $quillum_forwarded_for {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    client_max_body_size 32m;

    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;
        root /app/apps/web/dist;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; worker-src 'self' blob:" always;
        add_header Cache-Control $quillum_cache_control always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), publickey-credentials-create=(self), publickey-credentials-get=(self)" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /static/ {
            alias /app/apps/api/staticfiles/;
            expires 1h;
        }

        location ^~ /api/internal/collaboration/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://api:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $quillum_forwarded_for;
            proxy_set_header X-Forwarded-Proto $quillum_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /collaboration/ws {
            proxy_pass http://collaboration:8003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $quillum_forwarded_for;
            proxy_set_header X-Forwarded-Proto $quillum_forwarded_proto;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location /ws/ {
            proxy_pass http://realtime:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $quillum_forwarded_for;
            proxy_set_header X-Forwarded-Proto $quillum_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location /django-admin/ {
            proxy_pass http://api:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $quillum_forwarded_for;
            proxy_set_header X-Forwarded-Proto $quillum_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
